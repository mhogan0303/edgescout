<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EdgeScout — Sports Market Edge Detection</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <script src="/model.js"></script>
  <style>
    /* ─── Variables ───────────────────────────────────────────── */
    :root {
      --bg:          #0a0c0f;
      --surface:     #111418;
      --surface2:    #181c22;
      --border:      #1e2530;
      --border2:     #2a3040;
      --accent:      #e8ff47;
      --accent-dim:  #b8cc30;
      --green:       #39ff8f;
      --yellow:      #ffcc00;
      --red:         #ff4757;
      --muted:       #4a5568;
      --text:        #e2e8f0;
      --text-dim:    #8892a4;
      --text-faint:  #4a5568;
      --mono:        'DM Mono', monospace;
      --sans:        'DM Sans', sans-serif;
      --display:     'Bebas Neue', sans-serif;
    }

    /* ─── Reset & Base ────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { font-size: 16px; scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 0.875rem;
      line-height: 1.5;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Grid noise overlay for texture */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(232,255,71,0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(232,255,71,0.015) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* ─── Layout ──────────────────────────────────────────────── */
    .app {
      position: relative;
      z-index: 1;
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 16px 80px;
    }

    /* ─── Header ──────────────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 0 16px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 12px;
    }

    .logo {
      font-family: var(--display);
      font-size: clamp(2rem, 5vw, 3.2rem);
      letter-spacing: 0.04em;
      line-height: 1;
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .logo span:first-child { color: #fff; }
    .logo span:last-child  { color: var(--accent); }

    .logo-tag {
      font-family: var(--mono);
      font-size: 0.6rem;
      color: var(--accent-dim);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-left: 10px;
      padding: 2px 6px;
      border: 1px solid var(--accent-dim);
      border-radius: 2px;
      align-self: center;
    }

    .header-stats {
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .stat-item {
      text-align: right;
    }

    .stat-label {
      font-family: var(--mono);
      font-size: 0.6rem;
      color: var(--text-faint);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .stat-value {
      font-family: var(--mono);
      font-size: 1.1rem;
      color: var(--text);
      font-weight: 500;
    }

    .stat-value.highlight { color: var(--accent); }

    /* Live indicator */
    .live-indicator {
      display: flex;
      align-items: center;
      gap: 7px;
      font-family: var(--mono);
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      color: var(--text-dim);
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
      transition: background 0.4s;
    }

    .live-dot.active {
      background: var(--green);
      box-shadow: 0 0 8px var(--green), 0 0 20px rgba(57,255,143,0.3);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 8px var(--green), 0 0 20px rgba(57,255,143,0.3); }
      50%       { opacity: 0.6; box-shadow: 0 0 4px var(--green); }
    }

    /* ─── Settings Bar ────────────────────────────────────────── */
    .settings-toggle {
      display: none;
      width: 100%;
      padding: 10px 16px;
      margin-top: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-dim);
      font-family: var(--mono);
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      cursor: pointer;
      text-align: left;
      text-transform: uppercase;
    }

    @media (max-width: 768px) {
      .settings-toggle { display: flex; align-items: center; justify-content: space-between; }
    }

    .settings-bar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 18px 20px;
      margin: 14px 0;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 18px 24px;
      align-items: start;
    }

    @media (max-width: 768px) {
      .settings-bar { display: none; }
      .settings-bar.open { display: grid; grid-template-columns: 1fr; }
    }

    .setting-group label {
      display: block;
      font-family: var(--mono);
      font-size: 0.6rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-faint);
      margin-bottom: 7px;
    }

    .setting-group input[type="number"],
    .setting-group select {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: 4px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 0.85rem;
      padding: 7px 10px;
      outline: none;
      transition: border-color 0.2s;
    }

    .setting-group input[type="number"]:focus,
    .setting-group select:focus {
      border-color: var(--accent);
    }

    /* Range slider */
    .slider-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    input[type="range"] {
      -webkit-appearance: none;
      flex: 1;
      height: 4px;
      border-radius: 2px;
      background: var(--border2);
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid var(--bg);
      cursor: pointer;
      transition: transform 0.15s;
    }

    input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.2); }

    .slider-val {
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--accent);
      min-width: 36px;
      text-align: right;
    }

    /* Sport checkboxes */
    .checkbox-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .sport-cb {
      display: none;
    }

    .sport-label {
      font-family: var(--mono);
      font-size: 0.62rem;
      letter-spacing: 0.08em;
      padding: 4px 9px;
      border: 1px solid var(--border2);
      border-radius: 3px;
      cursor: pointer;
      color: var(--text-dim);
      transition: all 0.15s;
      user-select: none;
    }

    .sport-cb:checked + .sport-label {
      background: var(--accent);
      border-color: var(--accent);
      color: #0a0c0f;
      font-weight: 500;
    }

    /* Auto-refresh row */
    .refresh-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .toggle-switch {
      position: relative;
      width: 36px;
      height: 20px;
      flex-shrink: 0;
    }

    .toggle-switch input { display: none; }

    .toggle-track {
      position: absolute;
      inset: 0;
      background: var(--border2);
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .toggle-track::after {
      content: '';
      position: absolute;
      left: 3px;
      top: 3px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--text-dim);
      transition: left 0.2s, background 0.2s;
    }

    .toggle-switch input:checked + .toggle-track { background: var(--accent); }
    .toggle-switch input:checked + .toggle-track::after { left: 19px; background: #0a0c0f; }

    .refresh-label {
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--text-dim);
    }

    .refresh-select {
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: 4px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 0.72rem;
      padding: 4px 7px;
      outline: none;
    }

    /* ─── Scan Controls ───────────────────────────────────────── */
    .scan-bar {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 0 0 20px;
      flex-wrap: wrap;
    }

    .btn-scan {
      font-family: var(--display);
      font-size: 1.1rem;
      letter-spacing: 0.08em;
      padding: 9px 28px;
      background: var(--accent);
      color: #0a0c0f;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-scan:hover { background: #f5ff70; transform: translateY(-1px); }
    .btn-scan:active { transform: translateY(0); }
    .btn-scan:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .scan-status {
      font-family: var(--mono);
      font-size: 0.68rem;
      color: var(--text-faint);
      letter-spacing: 0.08em;
    }

    /* ─── Section Headers ─────────────────────────────────────── */
    .section-header {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin: 0 0 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .section-title {
      font-family: var(--display);
      font-size: 1.6rem;
      letter-spacing: 0.06em;
      color: var(--text);
    }

    .section-count {
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--text-faint);
    }

    .section-toggle {
      margin-left: auto;
      font-family: var(--mono);
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      color: var(--text-dim);
      background: none;
      border: 1px solid var(--border2);
      border-radius: 3px;
      padding: 4px 10px;
      cursor: pointer;
      transition: all 0.15s;
      text-transform: uppercase;
    }

    .section-toggle:hover { color: var(--accent); border-color: var(--accent); }

    /* ─── Loading / Error States ──────────────────────────────── */
    .spinner-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 60px 0;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--border2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .spinner-label {
      font-family: var(--mono);
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      color: var(--text-faint);
      text-transform: uppercase;
    }

    .error-box {
      background: rgba(255,71,87,0.08);
      border: 1px solid rgba(255,71,87,0.25);
      border-radius: 8px;
      padding: 24px;
      text-align: center;
    }

    .error-title {
      font-family: var(--display);
      font-size: 1.4rem;
      color: var(--red);
      margin-bottom: 8px;
    }

    .error-msg {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--text-dim);
      margin-bottom: 16px;
      word-break: break-all;
    }

    .btn-retry {
      font-family: var(--mono);
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      padding: 8px 20px;
      background: transparent;
      border: 1px solid var(--red);
      border-radius: 4px;
      color: var(--red);
      cursor: pointer;
      transition: all 0.15s;
      text-transform: uppercase;
    }

    .btn-retry:hover { background: rgba(255,71,87,0.12); }

    .empty-state {
      padding: 48px 0;
      text-align: center;
    }

    .empty-icon {
      font-size: 2.5rem;
      margin-bottom: 12px;
      opacity: 0.4;
    }

    .empty-title {
      font-family: var(--display);
      font-size: 1.3rem;
      color: var(--text-dim);
      margin-bottom: 8px;
    }

    .empty-sub {
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--text-faint);
      max-width: 360px;
      margin: 0 auto;
    }

    /* ─── Market Cards ────────────────────────────────────────── */
    .markets-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 12px;
    }

    @media (max-width: 600px) {
      .markets-grid { grid-template-columns: 1fr; }
    }

    .market-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      transition: border-color 0.2s, transform 0.15s;
      position: relative;
      overflow: hidden;
    }

    .market-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: transparent;
      transition: background 0.2s;
    }

    .market-card.tier-STRONG::before { background: var(--green); }
    .market-card.tier-MILD::before   { background: var(--yellow); }

    .market-card:hover {
      border-color: var(--border2);
      transform: translateY(-1px);
    }

    /* Card Header */
    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 10px;
    }

    .card-title {
      font-family: var(--sans);
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text);
      line-height: 1.4;
      flex: 1;
    }

    .sport-tag {
      font-family: var(--mono);
      font-size: 0.58rem;
      letter-spacing: 0.12em;
      padding: 3px 7px;
      border-radius: 3px;
      background: var(--surface2);
      border: 1px solid var(--border2);
      color: var(--text-dim);
      flex-shrink: 0;
      text-transform: uppercase;
    }

    /* Prices Row */
    .prices-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 10px 0;
    }

    .price-cell {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 8px 10px;
    }

    .price-cell-label {
      font-family: var(--mono);
      font-size: 0.58rem;
      letter-spacing: 0.1em;
      color: var(--text-faint);
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .price-cell-val {
      font-family: var(--mono);
      font-size: 1.15rem;
      font-weight: 500;
      color: var(--text);
    }

    .price-cell-val.best-yes { color: var(--green); }
    .price-cell-val.best-no  { color: var(--accent); }

    /* Stats Grid */
    .stats-mini {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin: 10px 0;
    }

    .stat-mini {
      background: var(--surface2);
      border-radius: 4px;
      padding: 6px 8px;
    }

    .stat-mini-label {
      font-family: var(--mono);
      font-size: 0.55rem;
      letter-spacing: 0.1em;
      color: var(--text-faint);
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .stat-mini-val {
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--text-dim);
    }

    /* Edge Score Block */
    .edge-block {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: 6px;
      padding: 12px 14px;
      margin: 10px 0;
    }

    .edge-score-big {
      font-family: var(--display);
      font-size: 2.8rem;
      line-height: 1;
      transition: color 0.3s;
    }

    .edge-score-big.tier-STRONG { color: var(--green); }
    .edge-score-big.tier-MILD   { color: var(--yellow); }
    .edge-score-big.tier-NONE   { color: var(--muted); }

    .edge-score-unit {
      font-family: var(--mono);
      font-size: 0.65rem;
      color: var(--text-faint);
    }

    .edge-info {
      flex: 1;
    }

    .edge-tier {
      font-family: var(--mono);
      font-size: 0.6rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .edge-tier.tier-STRONG { color: var(--green); }
    .edge-tier.tier-MILD   { color: var(--yellow); }
    .edge-tier.tier-NONE   { color: var(--muted); }

    .best-side-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-family: var(--mono);
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      padding: 3px 9px;
      border-radius: 4px;
    }

    .best-side-badge.side-YES {
      background: rgba(57,255,143,0.12);
      border: 1px solid rgba(57,255,143,0.3);
      color: var(--green);
    }

    .best-side-badge.side-NO {
      background: rgba(232,255,71,0.1);
      border: 1px solid rgba(232,255,71,0.25);
      color: var(--accent);
    }

    .kelly-row {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--text-dim);
      margin-top: 5px;
    }

    .kelly-amount {
      color: var(--text);
      font-weight: 500;
    }

    /* Card Footer */
    .card-foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      gap: 8px;
      flex-wrap: wrap;
    }

    .card-foot-item {
      font-family: var(--mono);
      font-size: 0.62rem;
      color: var(--text-faint);
    }

    .card-foot-item span { color: var(--text-dim); }

    .close-time {
      font-family: var(--mono);
      font-size: 0.62rem;
      color: var(--text-faint);
    }

    .close-time.urgent { color: var(--yellow); }
    .close-time.past   { color: var(--muted); }

    /* ─── All Markets Section ─────────────────────────────────── */
    .all-markets-section { margin-top: 32px; }

    .all-markets-body { display: none; }
    .all-markets-body.open { display: block; }

    /* ─── Scrollbar ───────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
  </style>
</head>
<body>
<div class="app">

  <!-- ─── Header ──────────────────────────────────────────── -->
  <header class="header">
    <div style="display:flex;align-items:center;gap:8px;">
      <div class="logo">
        <span>EDGE</span><span>SCOUT</span>
      </div>
      <span class="logo-tag">BETA</span>
    </div>

    <div class="header-stats">
      <div class="live-indicator">
        <div class="live-dot" id="liveDot"></div>
        <span id="liveLabel">IDLE</span>
      </div>
      <div class="stat-item">
        <div class="stat-label">Last Scan</div>
        <div class="stat-value" id="lastScanTime">—</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Markets</div>
        <div class="stat-value" id="totalMarkets">—</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Flagged</div>
        <div class="stat-value highlight" id="flaggedCount">—</div>
      </div>
    </div>
  </header>

  <!-- ─── Settings Toggle (mobile) ────────────────────────── -->
  <button class="settings-toggle" onclick="toggleSettings()">
    <span>⚙ Settings</span>
    <span id="settingsArrow">▼</span>
  </button>

  <!-- ─── Settings Bar ─────────────────────────────────────── -->
  <div class="settings-bar" id="settingsBar">

    <div class="setting-group">
      <label>Bankroll ($)</label>
      <input type="number" id="bankroll" value="500" min="10" max="1000000" step="10" />
    </div>

    <div class="setting-group">
      <label>Kelly Fraction — <span id="kellyLabel">25%</span></label>
      <div class="slider-row">
        <input type="range" id="kellySlider" min="10" max="100" value="25" step="5" />
        <span class="slider-val" id="kellyVal">25%</span>
      </div>
    </div>

    <div class="setting-group">
      <label>Min Edge Score — <span id="minEdgeLabel">2.5pp</span></label>
      <div class="slider-row">
        <input type="range" id="minEdgeSlider" min="0" max="15" value="2.5" step="0.5" />
        <span class="slider-val" id="minEdgeVal">2.5pp</span>
      </div>
    </div>

    <div class="setting-group">
      <label>Sport Filter</label>
      <div class="checkbox-grid">
        <input class="sport-cb" type="checkbox" id="cbAll" value="All" checked />
        <label class="sport-label" for="cbAll">ALL</label>
        <input class="sport-cb" type="checkbox" id="cbNBA" value="NBA" />
        <label class="sport-label" for="cbNBA">NBA</label>
        <input class="sport-cb" type="checkbox" id="cbNFL" value="NFL" />
        <label class="sport-label" for="cbNFL">NFL</label>
        <input class="sport-cb" type="checkbox" id="cbMLB" value="MLB" />
        <label class="sport-label" for="cbMLB">MLB</label>
        <input class="sport-cb" type="checkbox" id="cbNHL" value="NHL" />
        <label class="sport-label" for="cbNHL">NHL</label>
        <input class="sport-cb" type="checkbox" id="cbNCAAB" value="NCAAB" />
        <label class="sport-label" for="cbNCAAB">NCAAB</label>
        <input class="sport-cb" type="checkbox" id="cbPGA" value="PGA" />
        <label class="sport-label" for="cbPGA">PGA</label>
        <input class="sport-cb" type="checkbox" id="cbUFC" value="UFC" />
        <label class="sport-label" for="cbUFC">UFC</label>
        <input class="sport-cb" type="checkbox" id="cbTennis" value="TENNIS" />
        <label class="sport-label" for="cbTennis">Tennis</label>
        <input class="sport-cb" type="checkbox" id="cbSoccer" value="SOCCER" />
        <label class="sport-label" for="cbSoccer">Soccer</label>
      </div>
    </div>

    <div class="setting-group">
      <label>Auto-Refresh</label>
      <div class="refresh-row">
        <label class="toggle-switch">
          <input type="checkbox" id="autoRefreshToggle" />
          <span class="toggle-track"></span>
        </label>
        <span class="refresh-label">Every</span>
        <select class="refresh-select" id="refreshInterval">
          <option value="15">15s</option>
          <option value="30" selected>30s</option>
          <option value="60">60s</option>
        </select>
      </div>
    </div>

  </div>

  <!-- ─── Scan Controls ────────────────────────────────────── -->
  <div class="scan-bar">
    <button class="btn-scan" id="scanBtn" onclick="triggerScan()">
      <span>⚡</span> SCAN NOW
    </button>
    <span class="scan-status" id="scanStatus">Press scan to fetch live markets</span>
  </div>

  <!-- ─── Loading State ─────────────────────────────────────── -->
  <div id="loadingState" class="spinner-wrap" style="display:none;">
    <div class="spinner"></div>
    <div class="spinner-label">Scanning Kalshi markets…</div>
  </div>

  <!-- ─── Error State ───────────────────────────────────────── -->
  <div id="errorState" class="error-box" style="display:none;">
    <div class="error-title">SCAN FAILED</div>
    <div class="error-msg" id="errorMsg"></div>
    <button class="btn-retry" onclick="triggerScan()">↺ RETRY</button>
  </div>

  <!-- ─── Flagged Markets Section ───────────────────────────── -->
  <div id="mainContent" style="display:none;">

    <div class="section-header">
      <span class="section-title">FLAGGED EDGES</span>
      <span class="section-count" id="flaggedSection">0 markets</span>
    </div>

    <div id="flaggedGrid" class="markets-grid"></div>

    <!-- ─── All Markets Section ─────────────────────────────── -->
    <div class="all-markets-section">
      <div class="section-header">
        <span class="section-title">ALL MARKETS</span>
        <span class="section-count" id="allSection">0 markets</span>
        <button class="section-toggle" id="allToggleBtn" onclick="toggleAllMarkets()">▼ SHOW</button>
      </div>
      <div id="allMarketsBody" class="all-markets-body">
        <div id="allGrid" class="markets-grid"></div>
      </div>
    </div>

  </div>

</div>

<script>
// ─── State ──────────────────────────────────────────────────────────
let rawMarkets = [];       // raw from API
let analyzed  = [];        // after EdgeModel
let refreshTimer = null;

// ─── LocalStorage Persistence ────────────────────────────────────────
function loadSettings() {
  const br = localStorage.getItem('es_bankroll');
  const kf = localStorage.getItem('es_kelly');
  if (br) document.getElementById('bankroll').value = br;
  if (kf) {
    document.getElementById('kellySlider').value = parseFloat(kf) * 100;
    updateKellyLabel();
  }
}

function saveSettings() {
  localStorage.setItem('es_bankroll', document.getElementById('bankroll').value);
  const kf = document.getElementById('kellySlider').value / 100;
  localStorage.setItem('es_kelly', kf);
}

// ─── Getters ─────────────────────────────────────────────────────────
function getBankroll()    { return parseFloat(document.getElementById('bankroll').value) || 500; }
function getKelly()       { return parseInt(document.getElementById('kellySlider').value) / 100; }
function getMinEdge()     { return parseFloat(document.getElementById('minEdgeSlider').value); }
function getAutoRefresh() { return document.getElementById('autoRefreshToggle').checked; }
function getInterval()    { return parseInt(document.getElementById('refreshInterval').value) * 1000; }

function getActiveSports() {
  if (document.getElementById('cbAll').checked) return null; // null = all
  const sports = [];
  ['NBA','NFL','MLB','NHL','NCAAB','PGA','UFC','TENNIS','SOCCER'].forEach(s => {
    const cb = document.getElementById('cb' + s.charAt(0) + s.slice(1).toLowerCase());
    if (cb && cb.checked) sports.push(s);
  });
  return sports.length ? sports : null;
}

// ─── Labels ──────────────────────────────────────────────────────────
function updateKellyLabel() {
  const v = document.getElementById('kellySlider').value;
  document.getElementById('kellyLabel').textContent = v + '%';
  document.getElementById('kellyVal').textContent   = v + '%';
}

function updateMinEdgeLabel() {
  const v = document.getElementById('minEdgeSlider').value;
  document.getElementById('minEdgeLabel').textContent = v + 'pp';
  document.getElementById('minEdgeVal').textContent   = v + 'pp';
}

// ─── Mobile Settings Toggle ──────────────────────────────────────────
function toggleSettings() {
  const bar = document.getElementById('settingsBar');
  const arrow = document.getElementById('settingsArrow');
  bar.classList.toggle('open');
  arrow.textContent = bar.classList.contains('open') ? '▲' : '▼';
}

// ─── All Markets Toggle ──────────────────────────────────────────────
function toggleAllMarkets() {
  const body = document.getElementById('allMarketsBody');
  const btn  = document.getElementById('allToggleBtn');
  body.classList.toggle('open');
  btn.textContent = body.classList.contains('open') ? '▲ HIDE' : '▼ SHOW';
}

// ─── Live Dot ─────────────────────────────────────────────────────────
function setLive(active, label) {
  document.getElementById('liveDot').classList.toggle('active', active);
  document.getElementById('liveLabel').textContent = label;
}

// ─── Scan ─────────────────────────────────────────────────────────────
async function triggerScan() {
  const btn = document.getElementById('scanBtn');
  btn.disabled = true;
  document.getElementById('scanStatus').textContent = 'Scanning…';
  document.getElementById('loadingState').style.display = 'flex';
  document.getElementById('errorState').style.display   = 'none';
  document.getElementById('mainContent').style.display  = 'none';
  setLive(true, 'SCANNING');

  try {
    const res  = await fetch('/api/markets');
    if (!res.ok) {
      const body = await res.json().catch(() => ({ error: res.statusText }));
      throw new Error(body.error || `HTTP ${res.status}`);
    }
    const data = await res.json();
    rawMarkets = data.markets ?? [];

    const now = new Date();
    document.getElementById('lastScanTime').textContent =
      now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    document.getElementById('totalMarkets').textContent = rawMarkets.length;

    document.getElementById('scanStatus').textContent =
      `${rawMarkets.length} sports markets fetched — ${now.toLocaleTimeString()}`;

    runModelAndRender();
    setLive(true, 'LIVE');

  } catch (err) {
    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('errorState').style.display   = 'block';
    document.getElementById('errorMsg').textContent       = err.message;
    setLive(false, 'ERROR');
    document.getElementById('scanStatus').textContent = 'Scan failed. See error above.';
  } finally {
    btn.disabled = false;
  }
}

// ─── Model + Render ──────────────────────────────────────────────────
function runModelAndRender() {
  const bankroll    = getBankroll();
  const kelly       = getKelly();
  const minEdge     = getMinEdge();
  const sportFilter = getActiveSports();

  // Run model on all markets
  analyzed = rawMarkets.map(m => EdgeModel.analyzeMarket(m, bankroll, kelly));

  // Apply sport filter
  const visible = sportFilter
    ? analyzed.filter(m => sportFilter.includes(m.sport))
    : analyzed;

  // Sort by edge score desc
  const sorted = [...visible].sort((a, b) => b.edgeScore - a.edgeScore);

  // Flagged
  const flagged = sorted.filter(m => m.flagged && m.edgeScore >= minEdge);
  document.getElementById('flaggedCount').textContent = flagged.length;
  document.getElementById('flaggedSection').textContent = flagged.length + ' markets';
  renderGrid('flaggedGrid', flagged, true);

  // All
  document.getElementById('allSection').textContent = sorted.length + ' markets';
  renderGrid('allGrid', sorted, false);

  document.getElementById('loadingState').style.display = 'none';
  document.getElementById('mainContent').style.display  = 'block';

  saveSettings();
}

// ─── Render Grid ─────────────────────────────────────────────────────
function renderGrid(containerId, markets, showEmpty) {
  const container = document.getElementById(containerId);
  container.innerHTML = '';

  if (!markets.length && showEmpty) {
    container.innerHTML = `
      <div class="empty-state" style="grid-column:1/-1;">
        <div class="empty-icon">📡</div>
        <div class="empty-title">No Edges Detected</div>
        <div class="empty-sub">No edges detected in current markets. Refresh to scan again.</div>
      </div>`;
    return;
  }

  markets.forEach(m => {
    container.appendChild(buildCard(m));
  });
}

// ─── Build Card ──────────────────────────────────────────────────────
function buildCard(m) {
  const card = document.createElement('div');
  card.className = `market-card tier-${m.tier}`;

  const yb = m.yes_bid ?? '—';
  const nb = m.no_bid  ?? '—';

  const fairPct  = m.fairValue != null ? (m.fairValue * 100).toFixed(1) + '%' : '—';
  const vigTxt   = m.vigPct    != null ? m.vigPct.toFixed(1) + '%'         : '—';
  const edgeTxt  = m.edgeScore != null ? m.edgeScore.toFixed(1)            : '0.0';
  const betTxt   = m.recommendedBet > 0 ? '$' + m.recommendedBet.toFixed(2) : '$0.00';
  const volTxt   = m.volume       != null ? fmtNum(m.volume)      : '—';
  const oiTxt    = m.open_interest != null ? fmtNum(m.open_interest) : '—';
  const closeStr = formatCloseTime(m.close_time);

  const bestSideYes = m.bestSide === 'YES';

  card.innerHTML = `
    <div class="card-head">
      <div class="card-title">${escHtml(m.title || m.ticker || 'Unnamed Market')}</div>
      <span class="sport-tag">${escHtml(m.sport || '?')}</span>
    </div>

    <div class="prices-row">
      <div class="price-cell">
        <div class="price-cell-label">YES Bid</div>
        <div class="price-cell-val ${bestSideYes ? 'best-yes' : ''}">${yb}¢</div>
      </div>
      <div class="price-cell">
        <div class="price-cell-label">NO Bid</div>
        <div class="price-cell-val ${!bestSideYes && m.bestSide ? 'best-no' : ''}">${nb}¢</div>
      </div>
    </div>

    <div class="stats-mini">
      <div class="stat-mini">
        <div class="stat-mini-label">Vig</div>
        <div class="stat-mini-val">${vigTxt}</div>
      </div>
      <div class="stat-mini">
        <div class="stat-mini-label">Fair Value</div>
        <div class="stat-mini-val">${fairPct}</div>
      </div>
      <div class="stat-mini">
        <div class="stat-mini-label">Liq Score</div>
        <div class="stat-mini-val">${m.volScore != null ? (m.volScore * 100).toFixed(0) + '%' : '—'}</div>
      </div>
    </div>

    <div class="edge-block">
      <div>
        <div class="edge-score-big tier-${m.tier}">${edgeTxt}</div>
        <div class="edge-score-unit">pp edge</div>
      </div>
      <div class="edge-info">
        <div class="edge-tier tier-${m.tier}">${m.tier} EDGE</div>
        ${m.bestSide ? `
        <div class="best-side-badge side-${m.bestSide}">
          BET ${m.bestSide}
        </div>` : ''}
        <div class="kelly-row" style="margin-top:6px;">
          Kelly bet: <span class="kelly-amount">${betTxt}</span>
        </div>
      </div>
    </div>

    <div class="card-foot">
      <div class="card-foot-item">Vol <span>${volTxt}</span></div>
      <div class="card-foot-item">OI <span>${oiTxt}</span></div>
      <div class="${closeStr.cls}">${closeStr.txt}</div>
    </div>`;

  return card;
}

// ─── Utilities ────────────────────────────────────────────────────────
function escHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtNum(n) {
  if (n == null) return '—';
  if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
  return n.toLocaleString();
}

function formatCloseTime(closeTime) {
  if (!closeTime) return { txt: 'No expiry', cls: 'close-time' };
  const close = new Date(closeTime);
  const now   = new Date();
  const diff  = close - now;

  if (diff < 0)  return { txt: 'Expired', cls: 'close-time past' };

  const h = Math.floor(diff / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);

  if (h < 1)  return { txt: `Closes in ${m}m`, cls: 'close-time urgent' };
  if (h < 24) return { txt: `Closes in ${h}h ${m}m`, cls: h < 4 ? 'close-time urgent' : 'close-time' };

  const d = Math.floor(h / 24);
  return { txt: `Closes in ${d}d ${h % 24}h`, cls: 'close-time' };
}

// ─── Auto-Refresh ─────────────────────────────────────────────────────
function setupAutoRefresh() {
  clearInterval(refreshTimer);
  if (getAutoRefresh()) {
    refreshTimer = setInterval(triggerScan, getInterval());
    document.getElementById('scanStatus').textContent =
      `Auto-refreshing every ${document.getElementById('refreshInterval').value}s`;
  }
}

// ─── Event Listeners ──────────────────────────────────────────────────
document.getElementById('kellySlider').addEventListener('input', () => {
  updateKellyLabel();
  if (rawMarkets.length) runModelAndRender();
});

document.getElementById('minEdgeSlider').addEventListener('input', () => {
  updateMinEdgeLabel();
  if (rawMarkets.length) runModelAndRender();
});

document.getElementById('bankroll').addEventListener('input', () => {
  if (rawMarkets.length) runModelAndRender();
});

document.getElementById('autoRefreshToggle').addEventListener('change', setupAutoRefresh);
document.getElementById('refreshInterval').addEventListener('change', setupAutoRefresh);

// Sport checkboxes — "All" is exclusive
document.getElementById('cbAll').addEventListener('change', function() {
  if (this.checked) {
    ['NBA','NFL','MLB','NHL','NCAAB','PGA','UFC','TENNIS','SOCCER'].forEach(s => {
      const id = 'cb' + s.charAt(0) + s.slice(1).toLowerCase();
      const el = document.getElementById(id);
      if (el) el.checked = false;
    });
  }
  if (rawMarkets.length) runModelAndRender();
});

['NBA','NFL','MLB','NHL','NCAAB','PGA','UFC','TENNIS','SOCCER'].forEach(s => {
  const id = 'cb' + s.charAt(0) + s.slice(1).toLowerCase();
  const el = document.getElementById(id);
  if (!el) return;
  el.addEventListener('change', function() {
    if (this.checked) {
      document.getElementById('cbAll').checked = false;
    }
    if (rawMarkets.length) runModelAndRender();
  });
});

// ─── Init ─────────────────────────────────────────────────────────────
loadSettings();
updateKellyLabel();
updateMinEdgeLabel();
triggerScan();
</script>
</body>
</html>
