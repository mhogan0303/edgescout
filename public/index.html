
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EdgeScout</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <script src="/model.js"></script>
  <style>
    :root {
      --bg:       #0a0c0f;
      --surface:  #111418;
      --border:   #1e2530;
      --accent:   #e8ff47;
      --green:    #39ff8f;
      --yellow:   #ffcc00;
      --red:      #ff4757;
      --text:     #e2e8f0;
      --dim:      #8892a4;
      --faint:    #4a5568;
      --mono:     'DM Mono', monospace;
      --sans:     'DM Sans', sans-serif;
      --display:  'Bebas Neue', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
    }

    .app {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px 16px 80px;
    }

    /* ─── Header ─── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .logo {
      font-family: var(--display);
      font-size: 2.4rem;
      letter-spacing: 0.04em;
      line-height: 1;
    }
    .logo span:first-child { color: #fff; }
    .logo span:last-child  { color: var(--accent); }

    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .status-pill {
      font-family: var(--mono);
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid var(--faint);
      color: var(--dim);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--faint);
    }
    .status-dot.live {
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { opacity:1; }
      50%      { opacity:0.5; }
    }

    .last-scan {
      font-family: var(--mono);
      font-size: 0.65rem;
      color: var(--faint);
    }

    /* ─── Controls ─── */
    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    .btn-scan {
      font-family: var(--display);
      font-size: 1rem;
      letter-spacing: 0.06em;
      padding: 10px 28px;
      background: var(--accent);
      color: #0a0c0f;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-scan:hover   { background: #f5ff70; }
    .btn-scan:disabled { opacity: 0.5; cursor: not-allowed; }

    .bankroll-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .bankroll-wrap label {
      font-family: var(--mono);
      font-size: 0.65rem;
      color: var(--faint);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .bankroll-wrap input {
      width: 90px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 0.85rem;
      padding: 6px 10px;
      outline: none;
    }
    .bankroll-wrap input:focus { border-color: var(--accent); }

    .min-gap-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .min-gap-wrap label {
      font-family: var(--mono);
      font-size: 0.65rem;
      color: var(--faint);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .min-gap-wrap select {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 0.8rem;
      padding: 6px 8px;
      outline: none;
      cursor: pointer;
    }

    /* ─── Section heading ─── */
    .section-head {
      font-family: var(--display);
      font-size: 1.3rem;
      letter-spacing: 0.06em;
      color: var(--dim);
      margin-bottom: 14px;
      display: flex;
      align-items: baseline;
      gap: 10px;
    }
    .section-count {
      font-family: var(--mono);
      font-size: 0.65rem;
      color: var(--faint);
    }

    /* ─── Loading / Error ─── */
    .spinner-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 48px 0;
    }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner-label {
      font-family: var(--mono);
      font-size: 0.65rem;
      color: var(--faint);
      letter-spacing: 0.1em;
    }

    .error-box {
      background: rgba(255,71,87,0.08);
      border: 1px solid rgba(255,71,87,0.3);
      border-radius: 8px;
      padding: 20px;
      text-align: center;
    }
    .error-box p { font-family: var(--mono); font-size: 0.75rem; color: var(--red); margin-bottom: 12px; }
    .btn-retry {
      font-family: var(--mono);
      font-size: 0.7rem;
      padding: 7px 18px;
      background: transparent;
      border: 1px solid var(--red);
      border-radius: 4px;
      color: var(--red);
      cursor: pointer;
    }

    /* ─── Edge Card ─── */
    .edge-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .edge-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      position: relative;
    }

    .edge-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
    }
    .edge-card.strong::before { background: var(--green); }
    .edge-card.mild::before   { background: var(--yellow); }

    .card-inner {
      display: flex;
      align-items: center;
      padding: 16px 20px;
      gap: 20px;
      flex-wrap: wrap;
    }

    /* Signal block */
    .signal {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 80px;
      padding: 10px 14px;
      border-radius: 6px;
      flex-shrink: 0;
    }
    .signal.yes {
      background: rgba(57,255,143,0.1);
      border: 1px solid rgba(57,255,143,0.3);
    }
    .signal.no {
      background: rgba(255,71,87,0.1);
      border: 1px solid rgba(255,71,87,0.3);
    }
    .signal-action {
      font-family: var(--display);
      font-size: 1.1rem;
      letter-spacing: 0.05em;
      line-height: 1;
      margin-bottom: 2px;
    }
    .signal.yes .signal-action { color: var(--green); }
    .signal.no  .signal-action { color: var(--red); }
    .signal-label {
      font-family: var(--mono);
      font-size: 0.55rem;
      letter-spacing: 0.1em;
      color: var(--faint);
      text-transform: uppercase;
    }

    /* Main info */
    .card-info {
      flex: 1;
      min-width: 200px;
    }

    .card-title {
      font-family: var(--sans);
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text);
      line-height: 1.3;
      margin-bottom: 6px;
    }

    .card-subtitle {
      font-family: var(--mono);
      font-size: 0.68rem;
      color: var(--dim);
    }

    .card-subtitle .highlight {
      color: var(--accent);
      font-weight: 500;
    }

    /* Price comparison */
    .price-compare {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      flex-shrink: 0;
    }

    .price-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .price-label {
      font-family: var(--mono);
      font-size: 0.58rem;
      letter-spacing: 0.08em;
      color: var(--faint);
      text-transform: uppercase;
      width: 44px;
      text-align: right;
    }

    .price-val {
      font-family: var(--mono);
      font-size: 1rem;
      font-weight: 500;
      min-width: 48px;
      text-align: right;
    }

    .price-val.kalshi  { color: var(--text); }
    .price-val.vegas   { color: var(--accent); }

    .gap-badge {
      font-family: var(--mono);
      font-size: 0.7rem;
      font-weight: 500;
      padding: 2px 7px;
      border-radius: 3px;
      background: rgba(57,255,143,0.12);
      color: var(--green);
      margin-top: 2px;
      text-align: right;
    }

    /* Kelly / bet suggestion */
    .bet-suggest {
      flex-shrink: 0;
      text-align: center;
      padding: 10px 16px;
      background: rgba(232,255,71,0.06);
      border: 1px solid rgba(232,255,71,0.15);
      border-radius: 6px;
      min-width: 90px;
    }
    .bet-amount {
      font-family: var(--display);
      font-size: 1.4rem;
      color: var(--accent);
      line-height: 1;
      margin-bottom: 2px;
    }
    .bet-label {
      font-family: var(--mono);
      font-size: 0.55rem;
      color: var(--faint);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* Card footer */
    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 20px;
      border-top: 1px solid var(--border);
      gap: 12px;
      flex-wrap: wrap;
    }

    .footer-item {
      font-family: var(--mono);
      font-size: 0.6rem;
      color: var(--faint);
    }
    .footer-item span { color: var(--dim); }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 48px 0;
    }
    .empty-icon { font-size: 2rem; margin-bottom: 10px; opacity: 0.3; }
    .empty-title {
      font-family: var(--display);
      font-size: 1.2rem;
      color: var(--dim);
      margin-bottom: 6px;
    }
    .empty-sub {
      font-family: var(--mono);
      font-size: 0.68rem;
      color: var(--faint);
      max-width: 320px;
      margin: 0 auto;
    }

    /* No vegas note */
    .no-vegas-note {
      font-family: var(--mono);
      font-size: 0.65rem;
      color: var(--faint);
      padding: 10px 16px;
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 16px;
    }

    @media (max-width: 600px) {
      .card-inner { flex-direction: column; align-items: flex-start; }
      .price-compare { align-items: flex-start; }
      .bet-suggest { width: 100%; }
    }
  </style>
</head>
<body>
<div class="app">

  <!-- Header -->
  <header class="header">
    <div class="logo"><span>EDGE</span><span>SCOUT</span></div>
    <div class="header-right">
      <div class="status-pill">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusLabel">IDLE</span>
      </div>
      <div class="last-scan" id="lastScan"></div>
    </div>
  </header>

  <!-- Controls -->
  <div class="controls">
    <button class="btn-scan" id="scanBtn" onclick="triggerScan()">&#9889; SCAN NOW</button>

    <div class="bankroll-wrap">
      <label>Bankroll</label>
      <input type="number" id="bankroll" value="500" min="10" step="10" />
    </div>

    <div class="min-gap-wrap">
      <label>Min edge</label>
      <select id="minGap">
        <option value="2">2¢</option>
        <option value="3">3¢</option>
        <option value="4">4¢</option>
        <option value="5" selected>5¢</option>
        <option value="7">7¢</option>
        <option value="10">10¢</option>
      </select>
    </div>
  </div>

  <!-- Loading -->
  <div id="loadingState" class="spinner-wrap" style="display:none;">
    <div class="spinner"></div>
    <div class="spinner-label">Scanning markets&hellip;</div>
  </div>

  <!-- Error -->
  <div id="errorState" class="error-box" style="display:none;">
    <p id="errorMsg"></p>
    <button class="btn-retry" onclick="triggerScan()">&#8634; RETRY</button>
  </div>

  <!-- Main content -->
  <div id="mainContent" style="display:none;">

    <div class="section-head">
      EDGES FOUND <span class="section-count" id="edgeCount"></span>
    </div>

    <div id="noVegasNote" class="no-vegas-note" style="display:none;">
      &#9888; Some markets below don't have Vegas lines — those use a statistical baseline and are less reliable.
    </div>

    <div id="edgeList" class="edge-list"></div>

  </div>

</div>

<script>
var rawMarkets = [];
var refreshTimer = null;

function getBankroll() { return parseFloat(document.getElementById('bankroll').value) || 500; }
function getMinGap()   { return parseInt(document.getElementById('minGap').value) || 5; }

function setStatus(live, label) {
  document.getElementById('statusDot').className = 'status-dot' + (live ? ' live' : '');
  document.getElementById('statusLabel').textContent = label;
}

function kellyBet(edgeCents, askCents, bankroll) {
  // Simple Kelly: edge / odds * bankroll, capped at 5%
  var prob    = askCents / 100;
  var edge    = edgeCents / 100;
  var odds    = (100 / askCents) - 1;
  var kelly   = ((prob + edge) * odds - (1 - prob - edge)) / odds;
  var bet     = Math.max(0, kelly * 0.25 * bankroll); // quarter Kelly
  return Math.min(bet, bankroll * 0.05);              // cap at 5%
}

function triggerScan() {
  var btn = document.getElementById('scanBtn');
  btn.disabled = true;
  document.getElementById('loadingState').style.display = 'flex';
  document.getElementById('errorState').style.display   = 'none';
  document.getElementById('mainContent').style.display  = 'none';
  setStatus(true, 'SCANNING');

  fetch('/api/markets')
    .then(function(r) {
      if (!r.ok) return r.json().then(function(b) { throw new Error(b.error || 'HTTP ' + r.status); });
      return r.json();
    })
    .then(function(data) {
      rawMarkets = data.markets || [];
      document.getElementById('lastScan').textContent =
        'Last scan: ' + new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
      renderEdges();
      setStatus(true, 'LIVE');
    })
    .catch(function(err) {
      document.getElementById('loadingState').style.display = 'none';
      document.getElementById('errorState').style.display   = 'block';
      document.getElementById('errorMsg').textContent       = err.message;
      setStatus(false, 'ERROR');
    })
    .finally(function() { btn.disabled = false; });
}

function renderEdges() {
  var bankroll = getBankroll();
  var minGap   = getMinGap();

  // For each market: calculate gap between Vegas implied prob and Kalshi ask
  var edges = [];

  rawMarkets.forEach(function(m) {
    if (!m.has_vegas || m.vegas_prob === null) return; // Vegas only for now
    if (!m.yes_bid) return;

    var kalshiAsk  = m.yes_bid;              // yes_bid is actually ask price
    var vegasCents = Math.round(m.vegas_prob * 100);
    var gapCents   = vegasCents - kalshiAsk; // positive = Kalshi underpricing YES
    var abgGap     = Math.abs(gapCents);

    if (abgGap < minGap) return; // below threshold

    var betYes = gapCents > 0;   // YES is cheap on Kalshi vs Vegas
    var bet    = kellyBet(abgGap, betYes ? kalshiAsk : (100 - kalshiAsk), bankroll);

    edges.push({
      market:    m,
      kalshi:    kalshiAsk,
      vegas:     vegasCents,
      gap:       gapCents,
      absGap:    abgGap,
      betYes:    betYes,
      bet:       bet,
    });
  });

  // Sort by gap size descending
  edges.sort(function(a, b) { return b.absGap - a.absGap; });

  var list = document.getElementById('edgeList');
  list.innerHTML = '';

  document.getElementById('edgeCount').textContent = edges.length + ' market' + (edges.length !== 1 ? 's' : '');
  document.getElementById('mainContent').style.display = 'block';
  document.getElementById('loadingState').style.display = 'none';
  document.getElementById('noVegasNote').style.display = 'none';

  if (!edges.length) {
    list.innerHTML =
      '<div class="empty-state">' +
        '<div class="empty-icon">&#128225;</div>' +
        '<div class="empty-title">No Edges Found</div>' +
        '<div class="empty-sub">No markets exceed the ' + minGap + '&cent; minimum gap right now. Try lowering the threshold or scan again later.</div>' +
      '</div>';
    return;
  }

  edges.forEach(function(e) {
    var m      = e.market;
    var isStrong = e.absGap >= 8;

    // Extract clean game name from title
    var title = m.title || m.ticker || '';
    // Remove the "— YES = XXX wins" suffix for the main title
    var gameTitle = title.replace(/\s*—\s*YES\s*=\s*\S+\s*wins\s*$/i, '').trim();
    // What we're betting on
    var betOn = e.betYes
      ? title.match(/YES\s*=\s*(\S+)\s*wins/i)?.[1] || 'YES'
      : 'NO (other team)';

    var closeDiff = m.close_time
      ? Math.round((new Date(m.close_time) - new Date()) / (1000 * 60 * 60 * 24))
      : null;
    var closeStr = closeDiff !== null
      ? 'Closes in ' + closeDiff + 'd'
      : '';

    var vol = (m.volume || 0) + (m.open_interest || 0);
    var volStr = vol > 0 ? fmtNum(vol) + ' contracts' : 'No trading yet';

    var card = document.createElement('div');
    card.className = 'edge-card ' + (isStrong ? 'strong' : 'mild');

    card.innerHTML =
      '<div class="card-inner">' +

        // Signal
        '<div class="signal ' + (e.betYes ? 'yes' : 'no') + '">' +
          '<div class="signal-action">BET ' + (e.betYes ? 'YES' : 'NO') + '</div>' +
          '<div class="signal-label">' + betOn + '</div>' +
        '</div>' +

        // Info
        '<div class="card-info">' +
          '<div class="card-title">' + escHtml(gameTitle) + '</div>' +
          '<div class="card-subtitle">' +
            'Kalshi is <span class="highlight">' + e.absGap + '&cent; ' +
            (e.betYes ? 'cheaper' : 'more expensive') +
            '</span> than Vegas on ' + escHtml(betOn) +
          '</div>' +
        '</div>' +

        // Price comparison
        '<div class="price-compare">' +
          '<div class="price-row">' +
            '<div class="price-label">Kalshi</div>' +
            '<div class="price-val kalshi">' + e.kalshi + '&cent;</div>' +
          '</div>' +
          '<div class="price-row">' +
            '<div class="price-label">Vegas</div>' +
            '<div class="price-val vegas">~' + e.vegas + '&cent;</div>' +
          '</div>' +
          '<div class="gap-badge">+' + e.absGap + '&cent; edge</div>' +
        '</div>' +

        // Bet size
        (e.bet > 0 ?
          '<div class="bet-suggest">' +
            '<div class="bet-amount">$' + e.bet.toFixed(2) + '</div>' +
            '<div class="bet-label">Suggested bet</div>' +
          '</div>'
        : '') +

      '</div>' +

      // Footer
      '<div class="card-footer">' +
        '<div class="footer-item">&#127944; NFL &nbsp;|&nbsp; Game winner</div>' +
        '<div class="footer-item"><span>' + volStr + '</span></div>' +
        (closeStr ? '<div class="footer-item"><span>' + closeStr + '</span></div>' : '') +
        '<div class="footer-item" style="font-size:0.55rem;color:var(--faint);">' + escHtml(m.ticker || '') + '</div>' +
      '</div>';

    list.appendChild(card);
  });
}

function escHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtNum(n) {
  if (n >= 1e6) return (n/1e6).toFixed(1) + 'M';
  if (n >= 1e3) return (n/1e3).toFixed(1) + 'K';
  return n.toLocaleString();
}

// Re-render when settings change (no new fetch needed)
document.getElementById('bankroll').addEventListener('input', function() {
  if (rawMarkets.length) renderEdges();
});
document.getElementById('minGap').addEventListener('change', function() {
  if (rawMarkets.length) renderEdges();
});

// Load saved bankroll
var saved = localStorage.getItem('es_bankroll');
if (saved) document.getElementById('bankroll').value = saved;
document.getElementById('bankroll').addEventListener('change', function() {
  localStorage.setItem('es_bankroll', this.value);
});

// Auto-scan on load
triggerScan();
</script>
</body>
</html>
